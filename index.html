<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Operacional</title>

<style>
:root {
  --azul-escuro:#001E50;
  --azul:#2858F0;
  --verde:#22c55e;
  --amarelo:#f59e0b;
  --vermelho:#ef4444;
  --fundo:#edf3f8;
  --borda:#d7e1ee;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--fundo);
}

.container{
  padding:12px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--azul-escuro);
  color:#fff;
  padding:12px;
  border-radius:10px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.top-left img{
  height:42px;
  background:#fff;
  padding:5px 8px;
  border-radius:6px;
}

.top-left h2{
  margin:0;
}

.status-operacao{
  margin-top:10px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  padding:10px;
  border-radius:10px;
  color:#fff;
}

.verde{background:var(--verde);}
.amarelo{background:var(--amarelo);}
.vermelho{
  background:var(--vermelho);
  animation:piscando 1s infinite;
}

@keyframes piscando{
  0%{opacity:1;}
  50%{opacity:.6;}
  100%{opacity:1;}
}

.hero{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-top:10px;
}

.card{
  background:#fff;
  padding:10px;
  border-radius:10px;
  text-align:center;
  border-top:5px solid var(--azul);
}

.card div{
  font-size:12px;
  color:#475569;
  text-transform:uppercase;
  font-weight:bold;
}

.card strong{
  display:block;
  margin-top:4px;
  font-size:30px;
}

.card-separar{
  border-top-color:var(--vermelho);
  background:#fff5f5;
}

.card-conferir{
  border-top-color:#7c3aed;
}

.card-execucao{
  border-top-color:var(--azul);
  background:#eef4ff;
}

.card-pendente{
  border-top-color:var(--amarelo);
}

.card-pendente-alerta{
  background:#fff7ed;
  border-top-color:var(--amarelo);
}

.card-pendente-critico{
  background:#ffe5e5;
  border-top-color:var(--vermelho);
  animation:piscandoCard 1s infinite;
}

@keyframes piscandoCard{
  0%{box-shadow:0 0 0 rgba(239,68,68,0);}
  50%{box-shadow:0 0 12px rgba(239,68,68,.45);}
  100%{box-shadow:0 0 0 rgba(239,68,68,0);}
}

.card-concluido{
  border-top-color:var(--verde);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.panel-box{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  border:1px solid var(--borda);
}

.panel-header{
  background:var(--azul-escuro);
  color:#fff;
  padding:10px 12px;
  font-weight:bold;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  padding:8px;
  font-size:13px;
  border-bottom:1px solid #e5e7eb;
}

th{
  background:#eef4ff;
  color:#475569;
  text-transform:uppercase;
  font-size:12px;
}

.center{text-align:center;}
.left{text-align:left;}

.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:4px 10px;
  border-radius:15px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.separar-pill{
  background:#ffe5e5;
  color:#b91c1c;
}

.conferir-pill{
  background:#ede9fe;
  color:#6d28d9;
}

.linha-mais-antiga{
  background:#fff7cc;
  font-weight:bold;
}

.cliente-cell{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* SCROLL NOS DOIS QUADROS */
.panel-box table thead{
  display:table;
  width:100%;
  table-layout:fixed;
}

.panel-box tbody{
  display:block;
  height:550px;
  max-height:550px;
  overflow-y:auto;
  scroll-behavior:smooth;
  scrollbar-width:thin;
}

.panel-box tbody tr{
  display:table;
  width:100%;
  table-layout:fixed;
}

.panel-box tbody::-webkit-scrollbar{
  width:10px;
}

.panel-box tbody::-webkit-scrollbar-track{
  background:#edf3f8;
  border-radius:10px;
}

.panel-box tbody::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px;
}

.panel-box tbody::-webkit-scrollbar-thumb:hover{
  background:#94a3b8;
}

@media(max-width:1100px){
  .hero{
    grid-template-columns:repeat(3,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <div class="top-left">
    <img src="logo-labor.png" alt="Logo">
    <h2>Painel Operacional</h2>
  </div>

  <div style="display:flex; align-items:center; gap:10px;">
    
<a href="separacao.html" style="
  background:#2858f0;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
">
  👤 Pessoas
</a>

<a href="time.html" style="
  background:#7c3aed;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
">
  📊 Operação
</a>

<a href="conferencia.html" style="
  background:#0f766e;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
">
  ✅ Conferência
</a>

<a href="timeconf.html" style="
  background:#b45309;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
">
  🧑‍💼 Performance Conferentes
</a>

    <div id="atualizacao">--</div>

  </div>
</div>

  <div id="statusOperacao" class="status-operacao">--</div>

  <div class="hero">
    <div class="card card-separar">
      <div>Falta separar</div>
      <strong id="faltaSeparar">0</strong>
    </div>

    <div class="card card-conferir">
      <div>Falta conferir</div>
      <strong id="faltaConferir">0</strong>
    </div>

    <div class="card card-execucao">
      <div>Em execução</div>
      <strong id="emExecucao">0</strong>
    </div>

    <div id="cardTotalPendente" class="card card-pendente">
      <div>Total pendente</div>
      <strong id="totalPendente">0</strong>
    </div>

    <div class="card card-concluido">
      <div>Concluído</div>
      <strong id="concluido">0</strong>
    </div>

    <div class="card">
      <div>Total pedidos</div>
      <strong id="totalPedidos">0</strong>
    </div>
  </div>

  <div class="grid">

    <div class="panel-box">
      <div class="panel-header">Produtividade</div>
      <table>
        <thead>
          <tr>
            <th class="left">Separador</th>
            <th class="center">Pedidos</th>
            <th class="center">End.</th>
            <th class="center">%</th>
          </tr>
        </thead>
        <tbody id="produtividade"></tbody>
      </table>
    </div>

    <div class="panel-box">
      <div class="panel-header">Pedidos Pendentes</div>
      <table>
        <thead>
          <tr>
            <th class="center">Pedido</th>
            <th class="center">Integrado</th>
            <th class="center">Status</th>
            <th class="left">Cliente</th>
          </tr>
        </thead>
        <tbody id="pedidos"></tbody>
      </table>
    </div>

  </div>

</div>

<script>
async function carregar(){
  try{
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();

    document.getElementById('atualizacao').innerText = data.atualizacao || '--';

    const faltaSeparar = Number(data.cards.falta_separar || 0);
    const faltaConferir = Number(data.cards.falta_conferir || 0);
    const execucao = Number(data.cards.em_execucao || 0);
    const concluido = Number(data.cards.concluido || 0);
    const total = Number(data.cards.total_pedidos || 0);
    const pendente = total - concluido;

    document.getElementById('faltaSeparar').innerText = faltaSeparar;
    document.getElementById('faltaConferir').innerText = faltaConferir;
    document.getElementById('emExecucao').innerText = execucao;
    document.getElementById('totalPendente').innerText = pendente;
    document.getElementById('concluido').innerText = concluido;
    document.getElementById('totalPedidos').innerText = total;

    const statusBox = document.getElementById('statusOperacao');

    if(pendente >= 31){
      statusBox.className = 'status-operacao vermelho';
      statusBox.innerText = 'CRÍTICO - AÇÃO IMEDIATA';
    } else if(pendente >= 16){
      statusBox.className = 'status-operacao amarelo';
      statusBox.innerText = 'ATENÇÃO - VOLUME ELEVADO';
    } else {
      statusBox.className = 'status-operacao verde';
      statusBox.innerText = 'OPERAÇÃO SOB CONTROLE';
    }

    const cardPendente = document.getElementById('cardTotalPendente');
    cardPendente.className = 'card card-pendente';

    if(pendente > 20){
      cardPendente.className = 'card card-pendente card-pendente-critico';
    } else if(pendente > 10){
      cardPendente.className = 'card card-pendente card-pendente-alerta';
    }

    const prod = document.getElementById('produtividade');
    prod.innerHTML = '';

    const produtividadeOrdenada = [...data.produtividade].sort((a, b) => {
      const pA = parseFloat(String(a.percentual || '0').replace(',', '.').replace('%','').trim());
      const pB = parseFloat(String(b.percentual || '0').replace(',', '.').replace('%','').trim());
      return pB - pA;
    });

    produtividadeOrdenada.forEach(p=>{
      prod.innerHTML += `
        <tr>
          <td class="left">${p.separador}</td>
          <td class="center">${p.pedidos}</td>
          <td class="center">${p.enderecos}</td>
          <td class="center">${p.percentual}</td>
        </tr>`;
    });

    const ped = document.getElementById('pedidos');
    ped.innerHTML = '';

    const pedidosOrdenados = [...data.pedidos_pendentes].sort((a, b) => {
      const dataA = converterDataBR(a.integrado);
      const dataB = converterDataBR(b.integrado);
      return dataA - dataB;
    });

    pedidosOrdenados.forEach((p, index)=>{
      const statusLimpo = String(p.status || '')
        .trim()
        .toLowerCase()
        .replace(' ', '_');

      const classe = statusLimpo === 'falta_separar'
        ? 'separar-pill'
        : 'conferir-pill';

      const texto = statusLimpo === 'falta_separar'
        ? 'Falta Separar'
        : 'Falta Conferir';

      const classeLinha = index === 0 ? 'linha-mais-antiga' : '';

      ped.innerHTML += `
        <tr class="${classeLinha}">
          <td class="center">${p.pedido}</td>
          <td class="center">${p.integrado}</td>
          <td class="center">
            <span class="pill ${classe}">${texto}</span>
          </td>
          <td class="left cliente-cell" title="${p.cliente}">${p.cliente}</td>
        </tr>`;
    });

  }catch(e){
    console.error('Erro ao carregar data.json:', e);
  }
}

function converterDataBR(valor){
  if(!valor) return new Date(9999, 11, 31);

  const texto = String(valor).trim();
  const partes = texto.split(' ');
  const data = partes[0] || '';
  const hora = partes[1] || '00:00';

  const d = data.split('/');
  const h = hora.split(':');

  return new Date(
    Number(d[2]),
    Number(d[1]) - 1,
    Number(d[0]),
    Number(h[0] || 0),
    Number(h[1] || 0)
  );
}

/* ROLAGEM AUTOMÁTICA LENTA */
function iniciarScrollAutomatico(){
  document.querySelectorAll('.panel-box tbody').forEach(tbody => {
    let direcao = 1;

    setInterval(() => {
      if(tbody.scrollHeight <= tbody.clientHeight) return;

      tbody.scrollTop += direcao;

      if(tbody.scrollTop + tbody.clientHeight >= tbody.scrollHeight){
        direcao = -1;
      }

      if(tbody.scrollTop <= 0){
        direcao = 1;
      }

    }, 90);
  });
}

carregar();
iniciarScrollAutomatico();
setInterval(carregar,60000);
</script>

</body>
</html>
