<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Operacional - Separação e Conferência</title>

  <style>
    :root {
      --azul-escuro: #001E50;
      --azul: #2858F0;
      --verde: #64E678;
      --rosa: #FFD2F0;
      --fundo: #edf3f8;
      --card: #ffffff;
      --borda: #d7e1ee;
      --texto: #001E50;
      --muted: #65758b;
      --vermelho: #df4c4c;
      --roxo: #7c3aed;
      --laranja: #f97316;
      --top3: #fff7d6;
      --shadow: 0 12px 28px rgba(0, 30, 80, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7faff 0%, var(--fundo) 100%);
      color: var(--texto);
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, var(--azul-escuro) 0%, #07316f 58%, #164a98 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      color: #fff;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img {
      height: 52px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .title h1 {
      margin: 0;
      font-size: 30px;
      color: #fff;
      letter-spacing: .2px;
    }

    .title p {
      margin: 5px 0 0;
      font-size: 15px;
      color: #dce8ff;
      font-weight: 700;
    }

    .update-box {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      min-width: 190px;
    }

    .update-box .label { font-size: 11px; color: #dce8ff; font-weight: 800; text-transform: uppercase; }
    .update-box .time { font-size: 20px; color: #fff; font-weight: 900; }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-top: 7px solid var(--azul);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .hero-card.separar { border-top-color: var(--vermelho); background: linear-gradient(180deg,#fff,#fff7f7); }
    .hero-card.conferir { border-top-color: var(--roxo); background: linear-gradient(180deg,#fff,#f8f5ff); }
    .hero-card.pendente { border-top-color: var(--laranja); }
    .hero-card.concluido { border-top-color: var(--verde); }

    .hero-card .label { font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; }
    .hero-card .value { font-size: 42px; font-weight: 900; }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      min-height: 0;
    }

    .panel h2 { margin: 0 0 10px; font-size: 20px; color: var(--azul-escuro); }

    .table-shell { flex: 1; overflow: hidden; border-radius: 12px; border: 1px solid var(--borda); }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    thead { background: #eef4ff; }

    th { font-size: 12px; text-transform: uppercase; padding: 10px; color: var(--muted); font-weight: 900; }
    td { padding: 10px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e8eef5; color: var(--azul-escuro); }

    th.center, td.center { text-align: center; }
    th.left, td.left { text-align: left; }

    .top3 { background: var(--top3); }
    .top3 td:first-child { font-weight: 900; }

    .scroll { height: 100%; overflow: hidden; }

    .scroll-body.auto-scroll { animation: scroll 30s linear infinite; }

    @keyframes scroll { 0%{transform:translateY(0);}100%{transform:translateY(-50%);} }

    .pill { padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 900; display: inline-flex; justify-content: center; min-width: 112px; }

    .separar-pill {
      background: rgba(223,76,76,.16);
      color: #b91c1c;
      border: 1px solid rgba(223,76,76,.28);
    }

    .conferir-pill {
      background: rgba(124,58,237,.14);
      color: #6d28d9;
      border: 1px solid rgba(124,58,237,.26);
    }

    .pedido { color: var(--azul); font-weight: 900; }

    .small-table td { font-size: 13px; }

    .erro-dados {
      padding: 16px;
      background: #fff7f7;
      color: #b91c1c;
      border: 1px solid rgba(223,76,76,.25);
      border-radius: 12px;
      font-weight: 800;
      margin-top: 10px;
    }

    @media (max-width: 1200px){
      body{overflow:auto}
      .container{height:auto}
      .hero-grid, .content-grid{grid-template-columns:1fr}
      .scroll-body.auto-scroll{animation:none}
    }
  </style>
</head>

<body>
<div class="container">

  <div class="topbar">
    <div class="brand">
      <img src="logo-labor.png" alt="Labor Health Supply">
      <div class="title">
        <h1>Painel Operacional</h1>
        <p>Separação e Conferência • acompanhamento em tempo real</p>
      </div>
    </div>
    <div class="update-box">
      <div class="label">Atualização</div>
      <div class="time" id="atualizacao">--/-- --:--</div>
    </div>
  </div>

  <div class="hero-grid">
    <div class="hero-card separar"><div class="label">Falta separar</div><div class="value" id="card-falta-separar">0</div></div>
    <div class="hero-card conferir"><div class="label">Falta conferir</div><div class="value" id="card-falta-conferir">0</div></div>
    <div class="hero-card pendente"><div class="label">Total pendente</div><div class="value" id="card-total-pendente">0</div></div>
    <div class="hero-card concluido"><div class="label">Concluído</div><div class="value" id="card-concluido">0</div></div>
    <div class="hero-card"><div class="label">Total pedidos</div><div class="value" id="card-total-pedidos">0</div></div>
  </div>

  <div class="content-grid">

    <div class="panel">
      <h2>Produtividade Separadores</h2>
      <div class="table-shell">
        <table class="small-table">
          <thead>
            <tr>
              <th class="left">Separador</th>
              <th class="center">Pedidos</th>
              <th class="center">Endereços</th>
              <th class="center">%</th>
            </tr>
          </thead>
          <tbody id="tbody-produtividade"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Pedidos Pendentes</h2>

      <div class="table-shell">
        <table>
          <thead>
            <tr>
              <th class="center">Pedido</th>
              <th class="center">Integrado</th>
              <th class="center">Status</th>
              <th class="left">Cliente</th>
            </tr>
          </thead>
        </table>

        <div class="scroll" id="scrollArea">
          <table>
            <tbody class="scroll-body" id="scrollBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
  const CAMINHO_JSON = 'data.json';

  const medalhas = ['🥇', '🥈', '🥉'];

  function valorSeguro(valor, padrao = 0) {
    return valor === undefined || valor === null || valor === '' ? padrao : valor;
  }

  function textoStatus(status) {
    if (status === 'falta_separar') return 'Falta Separar';
    if (status === 'falta_conferir') return 'Falta Conferir';
    return status || '-';
  }

  function classeStatus(status) {
    if (status === 'falta_separar') return 'separar-pill';
    if (status === 'falta_conferir') return 'conferir-pill';
    return 'conferir-pill';
  }

  function atualizarCards(dados) {
    const cards = dados.cards || {};

    document.getElementById('atualizacao').textContent = valorSeguro(dados.atualizacao, '--/-- --:--');
    document.getElementById('card-falta-separar').textContent = valorSeguro(cards.falta_separar);
    document.getElementById('card-falta-conferir').textContent = valorSeguro(cards.falta_conferir);
    document.getElementById('card-total-pendente').textContent = valorSeguro(cards.total_pendente);
    document.getElementById('card-concluido').textContent = valorSeguro(cards.concluido);
    document.getElementById('card-total-pedidos').textContent = valorSeguro(cards.total_pedidos);
  }

  function atualizarProdutividade(dados) {
    const tbody = document.getElementById('tbody-produtividade');
    tbody.innerHTML = '';

    const lista = Array.isArray(dados.produtividade) ? dados.produtividade : [];

    lista.forEach((item, index) => {
      const tr = document.createElement('tr');
      if (index < 3) tr.classList.add('top3');

      const nome = index < 3 ? `${medalhas[index]} ${item.separador}` : item.separador;

      tr.innerHTML = `
        <td class="left">${valorSeguro(nome, '-')}</td>
        <td class="center">${valorSeguro(item.pedidos)}</td>
        <td class="center">${valorSeguro(item.enderecos)}</td>
        <td class="center">${valorSeguro(item.percentual, '0%')}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  function atualizarPedidosPendentes(dados) {
    const tbody = document.getElementById('scrollBody');
    tbody.innerHTML = '';
    tbody.classList.remove('auto-scroll');

    const lista = Array.isArray(dados.pedidos_pendentes) ? dados.pedidos_pendentes : [];

    lista.forEach((item) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="pedido center">${valorSeguro(item.pedido, '-')}</td>
        <td class="center">${valorSeguro(item.integrado, '-')}</td>
        <td class="center"><span class="pill ${classeStatus(item.status)}">${textoStatus(item.status)}</span></td>
        <td class="left">${valorSeguro(item.cliente, '-')}</td>
      `;
      tbody.appendChild(tr);
    });

    ativarScrollSeNecessario();
  }

  function ativarScrollSeNecessario() {
    const scrollArea = document.getElementById('scrollArea');
    const scrollBody = document.getElementById('scrollBody');

    if (!scrollArea || !scrollBody) return;

    requestAnimationFrame(() => {
      const precisaScroll = scrollBody.scrollHeight > scrollArea.clientHeight;

      if (precisaScroll) {
        scrollBody.classList.add('auto-scroll');
      } else {
        scrollBody.classList.remove('auto-scroll');
      }
    });
  }

  async function carregarDados() {
    try {
      const resposta = await fetch(`${CAMINHO_JSON}?t=${Date.now()}`, { cache: 'no-store' });

      if (!resposta.ok) {
        throw new Error('Não foi possível carregar o arquivo dados.json');
      }

      const dados = await resposta.json();

      atualizarCards(dados);
      atualizarProdutividade(dados);
      atualizarPedidosPendentes(dados);
    } catch (erro) {
      console.error(erro);
      const container = document.querySelector('.container');
      const aviso = document.createElement('div');
      aviso.className = 'erro-dados';
      aviso.textContent = 'Erro ao carregar data.json. Verifique se o arquivo está na mesma pasta do index.html e se o JSON está válido.';
      container.appendChild(aviso);
    }
  }

  carregarDados();
  setInterval(carregarDados, 60000);
  window.addEventListener('resize', ativarScrollSeNecessario);
</script>
</body>
</html>
