<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Operacional</title>

<style>
:root {
  --azul:#2858F0;
  --verde:#22c55e;
  --amarelo:#f59e0b;
  --vermelho:#ef4444;
  --fundo:#edf3f8;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--fundo);
}

.container{
  padding:12px;
}

/* TOPO */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#001E50;
  color:#fff;
  padding:12px;
  border-radius:10px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.top-left img{
  height:40px;
  background:#fff;
  padding:5px;
  border-radius:6px;
}

/* SEMÁFORO */
.status-operacao{
  text-align:center;
  font-weight:bold;
  font-size:18px;
  padding:10px;
  border-radius:10px;
  color:#fff;
}

.verde{background:var(--verde);}
.amarelo{background:var(--amarelo);}
.vermelho{
  background:var(--vermelho);
  animation:piscando 1s infinite;
}

@keyframes piscando{
  0%{opacity:1;}
  50%{opacity:0.6;}
  100%{opacity:1;}
}

/* CARDS */
.hero{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-top:10px;
}

.card{
  background:#fff;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.card strong{
  font-size:28px;
}

.alerta{
  border:3px solid var(--vermelho);
  background:#ffe5e5;
}

.execucao{
  border:3px solid var(--azul);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

/* TABELA */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
}

th,td{
  padding:8px;
  font-size:13px;
}

th{
  background:#eef4ff;
}

.pill{
  padding:4px 10px;
  border-radius:15px;
  font-size:11px;
  font-weight:bold;
}

.separar-pill{background:#ffe5e5;color:#b91c1c;}
.conferir-pill{background:#ede9fe;color:#6d28d9;}

</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <div class="top-left">
    <img src="logo-labor.png">
    <h2>Painel Operacional</h2>
  </div>
  <div id="atualizacao">--</div>
</div>

<div id="statusOperacao" class="status-operacao">--</div>

<div class="hero">
  <div class="card alerta">
    <div>Falta separar</div>
    <strong id="faltaSeparar">0</strong>
  </div>

  <div class="card">
    <div>Falta conferir</div>
    <strong id="faltaConferir">0</strong>
  </div>

  <div class="card execucao">
    <div>Em execução</div>
    <strong id="emExecucao">0</strong>
  </div>

  <div class="card">
    <div>Pendente</div>
    <strong id="totalPendente">0</strong>
  </div>

  <div class="card">
    <div>Concluído</div>
    <strong id="concluido">0</strong>
  </div>

  <div class="card">
    <div>Total</div>
    <strong id="totalPedidos">0</strong>
  </div>
</div>

<div class="grid">

<div>
<h3>Produtividade</h3>
<table>
<thead>
<tr>
<th>Separador</th>
<th>Pedidos</th>
<th>End.</th>
<th>%</th>
</tr>
</thead>
<tbody id="produtividade"></tbody>
</table>
</div>

<div>
<h3>Pedidos Pendentes</h3>
<table>
<thead>
<tr>
<th>Pedido</th>
<th>Integrado</th>
<th>Status</th>
<th>Cliente</th>
</tr>
</thead>
<tbody id="pedidos"></tbody>
</table>
</div>

</div>

</div>

<script>
async function carregar(){
  const res = await fetch('data.json?t='+Date.now());
  const data = await res.json();

  document.getElementById('atualizacao').innerText = data.atualizacao;

  const faltaSeparar = data.cards.falta_separar;
  const faltaConferir = data.cards.falta_conferir;
  const execucao = data.cards.em_execucao;
  const concluido = data.cards.concluido;
  const total = data.cards.total_pedidos;

  const pendente = total - concluido;

  document.getElementById('faltaSeparar').innerText = faltaSeparar;
  document.getElementById('faltaConferir').innerText = faltaConferir;
  document.getElementById('emExecucao').innerText = execucao;
  document.getElementById('totalPendente').innerText = pendente;
  document.getElementById('concluido').innerText = concluido;
  document.getElementById('totalPedidos').innerText = total;

  // SEMÁFORO
  const statusBox = document.getElementById('statusOperacao');

  if(pendente > 20){
    statusBox.className = 'status-operacao vermelho';
    statusBox.innerText = 'CRÍTICO - AÇÃO IMEDIATA';
  } else if(pendente > 10){
    statusBox.className = 'status-operacao amarelo';
    statusBox.innerText = 'ATENÇÃO - RISCO DE ATRASO';
  } else {
    statusBox.className = 'status-operacao verde';
    statusBox.innerText = 'OPERAÇÃO SOB CONTROLE';
  }

  // PRODUTIVIDADE
  const prod = document.getElementById('produtividade');
  prod.innerHTML = '';

  data.produtividade.forEach(p=>{
    prod.innerHTML += `
      <tr>
        <td>${p.separador}</td>
        <td>${p.pedidos}</td>
        <td>${p.enderecos}</td>
        <td>${p.percentual}</td>
      </tr>`;
  });

  // PEDIDOS
  const ped = document.getElementById('pedidos');
  ped.innerHTML = '';

  data.pedidos_pendentes.forEach(p=>{
    const statusLimpo = String(p.status).trim().toLowerCase().replace(' ','_');

    const classe = statusLimpo === 'falta_separar'
      ? 'separar-pill'
      : 'conferir-pill';

    const texto = statusLimpo === 'falta_separar'
      ? 'Falta Separar'
      : 'Falta Conferir';

    ped.innerHTML += `
      <tr>
        <td>${p.pedido}</td>
        <td>${p.integrado}</td>
        <td><span class="pill ${classe}">${texto}</span></td>
        <td>${p.cliente}</td>
      </tr>`;
  });

}

carregar();
setInterval(carregar,120000);
</script>

</body>
</html>
